<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>出勤・配車ボード</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <header class="app-header">
    <div class="header-left">
      <span class="app-title">出勤・配車ボード</span>
    </div>
    <div class="header-clock">
      <div id="clock-time" class="clock-time"></div>
      <div id="clock-date" class="clock-date"></div>
    </div>
    <div class="header-right">
      <button id="btn-schedule-admin" class="header-btn" type="button">スケジュール管理</button>
      <button id="btn-staff-admin" class="header-btn" type="button">従業員管理</button>
      <button id="btn-site-admin" class="header-btn" type="button">現場管理</button>
      <button id="btn-records" class="header-btn" type="button">出退勤記録</button>
      <button id="btn-vehicle-admin" class="header-btn" type="button">車両管理</button>
      <button id="btn-reset-data" class="header-btn header-btn-danger" type="button">保存データ消去</button>
      <button id="btn-fullscreen" class="header-btn" type="button">全画面</button>
    </div>
  </header>

  <nav class="dept-tabs" id="dept-tabs" aria-label="部門切替">
    <button class="dept-tab dept-tab-doboku" data-dept="doboku" type="button">
      <span class="dept-tab-name">土木</span>
      <span class="dept-tab-count" id="tab-count-doboku"></span>
    </button>
    <button class="dept-tab dept-tab-unyu" data-dept="unyu" type="button">
      <span class="dept-tab-name">運輸</span>
      <span class="dept-tab-count" id="tab-count-unyu"></span>
    </button>
    <button class="dept-tab dept-tab-office" data-dept="office" type="button">
      <span class="dept-tab-name">事務</span>
      <span class="dept-tab-count" id="tab-count-office"></span>
    </button>
    <button class="dept-tab dept-tab-summary" data-dept="summary" type="button">
      <span class="dept-tab-name">全体確認</span>
    </button>
  </nav>

  <main id="board">

    <section class="dept-section dept-doboku" data-panel="doboku">
      <div class="dept-header">
        <span class="dept-icon">🚧</span>
        <span class="dept-name">土木部門</span>
        <button id="btn-doboku-dispatch-create" class="dept-action-btn" type="button">＋ 現場配置を作成</button>
      </div>
      <div class="lane-toolbar">
        <button id="btn-doboku-expand-all" class="toolbar-btn" type="button">すべて開く</button>
        <button id="btn-doboku-collapse-all" class="toolbar-btn" type="button">すべて閉じる</button>
      </div>
      <div id="doboku-list" class="lane-stack stack-doboku"></div>
    </section>

    <section class="dept-section dept-unyu" data-panel="unyu">
      <div class="dept-header">
        <span class="dept-icon">🚚</span>
        <span class="dept-name">運輸部門</span>
        <div class="dept-header-actions">
          <button id="btn-dispatch-register" class="dept-action-btn" type="button">＋ 現場配車を作成</button>
          <button id="btn-unyu-site-edit" class="dept-action-btn dept-action-btn-alt" type="button">既存現場を編集</button>
          <button id="btn-unyu-vehicle-status" class="dept-action-btn dept-action-btn-alt" type="button">車両状態</button>
        </div>
      </div>
      <div id="unyu-summary" class="dept-summary-bar"></div>
      <div class="lane-toolbar">
        <button id="btn-unyu-expand-all" class="toolbar-btn" type="button">すべて開く</button>
        <button id="btn-unyu-collapse-all" class="toolbar-btn" type="button">すべて閉じる</button>
      </div>
      <div id="unyu-list" class="lane-stack stack-unyu"></div>
    </section>

    <section class="dept-section dept-office" data-panel="office">
      <div class="dept-header">
        <span class="dept-icon">🗂️</span>
        <span class="dept-name">事務部門</span>
      </div>
      <div id="office-list" class="office-grid"></div>
    </section>

    <section class="dept-section dept-summary" data-panel="summary">
      <div class="dept-header">
        <span class="dept-icon">📊</span>
        <span class="dept-name">全体確認</span>
      </div>
      <div id="summary-content" class="summary-content"></div>
    </section>

  </main>

  <div id="modal-root" class="modal-root hidden" aria-hidden="true"></div>

</div>

<script src="storage.js"></script>
<script src="seed.js"></script>
<script src="app.js"></script>
</body>
</html>
