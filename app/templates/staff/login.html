{% extends "staff/base.html" %}
{% block title %}名前を選んでください{% endblock %}
{% block content %}
<div class="login-wrap">
  <h1>あなたの名前を選んでください</h1>
  {% if error %}<p class="error-text">{{ error }}</p>{% endif %}
  <form method="post" class="name-grid">
    {% for s in staff %}
      <button type="submit" name="name" value="{{ s['name'] }}" class="{{ 'recent' if s['name'] == recent else '' }}">{{ s['name'] }}</button>
    {% endfor %}
  </form>
  <details>
    <summary>名前が一覧にない場合</summary>
    <form method="post" style="margin-top:10px;">
      <input type="text" name="name" placeholder="名前を入力" required>
      <button type="submit">入る</button>
    </form>
  </details>
  <p class="note">パスワードは不要です。選んだ名前は「誰が入力したか」の作業ログとして記録されます。</p>
</div>
{% endblock %}
